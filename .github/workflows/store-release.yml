name: Store release trust chain
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with a reviewed checked-in .store/manifests entry
        type: string
        required: true
      input_transport:
        description: Private inputs transport - auto prefers the read-only SSH deploy key; PAT is an explicit alternative
        type: choice
        options: [auto, ssh, pat]
        default: auto
      sign_and_attest:
        description: Publish keyless signatures and GitHub attestations
        type: boolean
        default: false
      publish:
        description: Publish the already tested and signed wheel to PyPI
        type: boolean
        default: false
      vt_report_urls:
        description: Manual mode - whitespace-separated exact VirusTotal GUI SHA256 URLs for every final hash
        type: string
        default: ''
      vt_observed_at:
        description: Manual mode - owner observation timestamp with timezone (ISO8601)
        type: string
        default: ''
      vt_commercial_api_authorized:
        description: API mode only - owner confirms a licence permitting this commercial workflow (Public API forbidden)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: store-ta-lib-takt-${{ github.ref }}
  cancel-in-progress: false
env:
  STORE_PACKAGE: 'ta-lib-takt'
  STORE_VERSION: ${{ inputs.version }}
jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Assemble only reviewed hash-pinned store inputs
        env:
          ENABLE_SIGNING: ${{ inputs.sign_and_attest }}
          ENABLE_PUBLISHING: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os,re,json
          version=os.environ['STORE_VERSION']
          if not re.fullmatch(r'[0-9][A-Za-z0-9.]+',version): raise SystemExit('invalid version')
          if os.environ['ENABLE_PUBLISHING']=='true' and os.environ['ENABLE_SIGNING']!='true': raise SystemExit('publishing requires signing')
          manifest=json.load(open('.store/manifests/'+os.environ['STORE_PACKAGE']+'/'+version+'.json'))
          if manifest['package']!=os.environ['STORE_PACKAGE'] or manifest['version']!=version: raise SystemExit('manifest identity mismatch')
          PY
      - name: Verify independent public vendor entitlement anchor
        run: python tools/trust/entitlement.py verify-anchor --public-key trust/vendor-entitlement-v1.pub.pem
      - name: Test offline trust helpers
        run: python -m unittest discover -s tools/trust -p 'test_*.py' -v
      - name: Fetch reviewed inputs using the read-only deploy key or release PAT
        env:
          GH_TOKEN: ${{ secrets.STORE_INPUTS_READ_TOKEN }}
          STORE_INPUTS_DEPLOY_KEY: ${{ secrets.STORE_INPUTS_DEPLOY_KEY }}
          INPUT_TRANSPORT: ${{ inputs.input_transport }}
        run: python tools/trust/fetch_private_inputs.py --descriptor ".store/inputs/$STORE_PACKAGE/$STORE_VERSION.json" --output store-inputs --transport "$INPUT_TRANSPORT"
      - name: Assemble the approved store inputs without a protector
        run: python tools/trust/ci_support.py assemble --manifest ".store/manifests/$STORE_PACKAGE/$STORE_VERSION.json" --output store-release
      - name: Keep final artifacts separate from reference/check inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-final-ta-lib-takt
          path: |
            store-release/dist/*.whl
            store-release/dist/*.store.json
            store-release/native/**/*
            store-release/STORE_MANIFEST.json
            store-release/release_files.json
            store-release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-check-input-ta-lib-takt
          path: store-release/
          if-no-files-found: error
      - name: Keep the PyPI upload artifact limited to final wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-pypi-ta-lib-takt
          path: store-release/dist/*.whl
          if-no-files-found: error
  checks:
    needs: assemble
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-check-input-ta-lib-takt
          path: store-release
      - name: Install declared test dependencies and tracer
        run: |
          python -m pip install --only-binary=:all: numpy==2.5.4 scipy==1.18.1 narwhals==2.28.0
          sudo apt-get update -qq
          sudo apt-get install -y strace util-linux
      - name: Check installed final wheel and complete native outputs
        run: python tools/trust/ci_support.py check --bundle store-release --output check-results
      - name: Upload summary only, never raw traces or model/input contents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-check-summary-ta-lib-takt
          path: check-results/RESULT.json
          if-no-files-found: warn
  scanners:
    needs: assemble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-final-ta-lib-takt
          path: store-release
      - name: Dated local ClamAV signal on final bytes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service
          if [ -f /etc/apparmor.d/usr.bin.freshclam ]; then
            cat /etc/apparmor.d/usr.bin.freshclam > CLAMAV_APPARMOR_PROFILE.txt
          fi
          sudo python3 tools/trust/prepare_clamav.py --root /var/lib/clamav/store-release --owner clamav --metadata CLAMAV_CONFIG.json
          sudo chown clamav:clamav /var/lib/clamav/store-release /var/lib/clamav/store-release/db
          sudo install -o root -g clamav -m 0640 /var/lib/clamav/store-release/freshclam.conf /etc/clamav/freshclam.conf
          sudo cmp /var/lib/clamav/store-release/freshclam.conf /etc/clamav/freshclam.conf
          sudo stat -c '%n mode=%a owner=%U group=%G' /etc/clamav/freshclam.conf /var/lib/clamav/store-release/db > CLAMAV_INSTALLED_PATHS.txt
          sudo freshclam --config-file=/etc/clamav/freshclam.conf --version > FRESHCLAM_CONFIG_CHECK.txt 2>&1
          sudo freshclam --stdout --config-file=/etc/clamav/freshclam.conf 2>&1 | tee FRESHCLAM.txt
          sudo freshclam --config-file=/etc/clamav/freshclam.conf --version > CLAMAV_DEFINITIONS.txt
          sudo clamscan --database=/var/lib/clamav/store-release/db --fail-if-cvd-older-than=2 --alert-exceeds-max=yes --recursive --scan-archive=yes --max-filesize=512M --max-scansize=2048M store-release/dist store-release/native 2>&1 | tee CLAMAV.txt
          python tools/trust/summarize_clamav.py --scan CLAMAV.txt --definitions CLAMAV_DEFINITIONS.txt --update FRESHCLAM.txt --output CLAMAV_SUMMARY.json
      - name: Dated VirusTotal observations - licensed GET API or owner-supplied hash links
        if: always()
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ENABLE_SIGNING: ${{ inputs.sign_and_attest }}
          VT_REPORT_URLS: ${{ inputs.vt_report_urls }}
          VT_OBSERVED_AT: ${{ inputs.vt_observed_at }}
          VT_COMMERCIAL_API_AUTHORIZED: ${{ inputs.vt_commercial_api_authorized }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--query --output VIRUSTOTAL.json --markdown-output VIRUSTOTAL_LINKS.md
            --manual-report-urls "$VT_REPORT_URLS" --observed-at "$VT_OBSERVED_AT")
          if [ "$ENABLE_SIGNING" = true ]; then options+=(--require-complete); fi
          if [ "$VT_COMMERCIAL_API_AUTHORIZED" = true ]; then options+=(--commercial-api-authorized); fi
          status=0
          python tools/trust/virustotal_hashes.py store-release/dist/*.store.json "${options[@]}" || status=$?
          if [ -f VIRUSTOTAL_LINKS.md ]; then cat VIRUSTOTAL_LINKS.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-scanner-summary-ta-lib-takt
          path: |
            CLAMAV.txt
            CLAMAV_SUMMARY.json
            FRESHCLAM.txt
            CLAMAV_CONFIG.json
            CLAMAV_INSTALLED_PATHS.txt
            CLAMAV_APPARMOR_PROFILE.txt
            FRESHCLAM_CONFIG_CHECK.txt
            CLAMAV_DEFINITIONS.txt
            VIRUSTOTAL.json
            VIRUSTOTAL_LINKS.md
          if-no-files-found: warn
  sign:
    needs: [assemble, checks, scanners]
    if: inputs.sign_and_attest && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: store-signing
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-final-ta-lib-takt
          path: store-release
      - name: Install independently pinned signing tool
        run: python tools/trust/install_cosign.py --output signing-tools/cosign
      # Keyless artifact signatures use GitHub OIDC; vendor key is for offline entitlements only.
      - name: Sign final wheel, exact native payloads and manifest; execute none
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: python tools/trust/sign_release.py --bundle store-release --output signatures --cosign signing-tools/cosign --mode keyless --identity "$EXPECTED_IDENTITY"
      - name: Attest assembly provenance of final artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            store-release/dist/*.whl
            store-release/native/**/*
            store-release/STORE_MANIFEST.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-signatures-ta-lib-takt
          path: signatures/
          if-no-files-found: error
  publish:
    needs: [assemble, checks, scanners, sign]
    if: inputs.publish && inputs.sign_and_attest && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/ta-lib-takt
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-pypi-ta-lib-takt
          path: dist
      - name: PyPI Trusted Publishing with PEP 740 publish attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
