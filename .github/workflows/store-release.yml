name: Store release trust chain
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with a reviewed checked-in .store/manifests entry
        type: string
        required: true
      input_transport:
        description: Private inputs transport - auto prefers the read-only SSH deploy key; PAT is an explicit alternative
        type: choice
        options: [auto, ssh, pat]
        default: auto
      sign_and_attest:
        description: Publish keyless signatures and GitHub attestations
        type: boolean
        default: false
      publish:
        description: Publish the already tested and signed wheel to PyPI
        type: boolean
        default: false
      vt_report_urls:
        description: Manual mode - whitespace-separated exact VirusTotal GUI SHA256 URLs for every final hash
        type: string
        default: ''
      vt_observed_at:
        description: Manual mode - owner observation timestamp with timezone (ISO8601)
        type: string
        default: ''
      vt_commercial_api_authorized:
        description: API mode only - owner confirms a licence permitting this commercial workflow (Public API forbidden)
        type: boolean
        default: false
      desktop_bootstrap:
        description: Collect unsigned Windows/macOS runner inventory only; no desktop SKU release, credentials or payload execution
        type: boolean
        default: false
      desktop_signing_smoke:
        description: Protected tiny public fixture signing protocol only - requires sign_and_attest=true and publish=false; never a SKU release
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: store-ta-lib-takt-${{ github.ref }}
  cancel-in-progress: false
env:
  STORE_PACKAGE: 'ta-lib-takt'
  STORE_VERSION: ${{ inputs.version }}
jobs:
  desktop-bootstrap:
    # Inventory only. This opt-in job cannot sign, publish or certify a SKU.
    if: inputs.desktop_bootstrap && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x86_64
            runner: windows-latest
            python_arch: x64
          - target: macos_x86_64
            runner: macos-15-intel
            python_arch: x64
          - target: macos_arm64
            runner: macos-15
            python_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Offline parser and fail-closed controls only
        run: python -m unittest discover -s tools/trust -p "test_desktop_*.py" -v
      - name: Capture native runner availability without reading signing credentials
        run: python tools/trust/desktop_bootstrap.py --target "${{ matrix.target }}" --output desktop-bootstrap/RESULT.json
      - name: Upload safe bootstrap receipt, not a release PASS or raw trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-desktop-bootstrap-${{ env.STORE_PACKAGE }}-${{ matrix.target }}
          path: desktop-bootstrap/RESULT.json
          if-no-files-found: warn
  desktop-signing-config:
    if: inputs.desktop_signing_smoke && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Refuse implicit signing or any bootstrap publication
        env:
          ENABLE_SIGNING: ${{ inputs.sign_and_attest }}
          ENABLE_PUBLISHING: ${{ inputs.publish }}
        run: python tools/trust/desktop_signing.py protocol-check --target windows_x86_64 --output desktop-protocol
  desktop-signing-macos:
    needs: desktop-signing-config
    if: inputs.desktop_signing_smoke && inputs.sign_and_attest && !inputs.publish && github.ref == 'refs/heads/main'
    environment: store-signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported signing hosts; this does not claim macOS13 runtime testing.
          - target: macos_arm64
            runner: ${{ vars.STORE_MACOS_ARM_RUNNER || 'macos-15' }}
            python_arch: arm64
          - target: macos_x86_64
            runner: ${{ vars.STORE_MACOS_INTEL_RUNNER || 'macos-15-intel' }}
            python_arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Offline controls before protected environment operations
        run: python -m unittest discover -s tools/trust -p "test_desktop_*.py" -v
      - name: Tiny public signing protocol control - no SKU execution
        env:
          ENABLE_SIGNING: ${{ inputs.sign_and_attest }}
          ENABLE_PUBLISHING: ${{ inputs.publish }}
          APPLE_SIGNING_P12_B64: ${{ secrets.APPLE_SIGNING_P12_B64 }}
          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          APPLE_ASC_KEY_P8_B64: ${{ secrets.APPLE_ASC_KEY_P8_B64 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_CERT_SHA1: ${{ vars.APPLE_SIGNING_CERT_SHA1 }}
          APPLE_SIGNING_CERT_SHA256: ${{ vars.APPLE_SIGNING_CERT_SHA256 }}
        run: python tools/trust/desktop_signing.py macos-smoke --target "${{ matrix.target }}" --output desktop-signing-smoke
      - name: Attest only final public control bytes and safe receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            desktop-signing-smoke/subjects/desktop-signing-smoke
            desktop-signing-smoke/subjects/libdesktop-signing-smoke-lib.dylib
            desktop-signing-smoke/RESULT.json
      - name: Safe public control evidence only - no keychain or credentials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-signing-smoke-${{ env.STORE_PACKAGE }}-${{ matrix.target }}
          path: |
            desktop-signing-smoke/RESULT.json
            desktop-signing-smoke/SUBJECTS.json
            desktop-signing-smoke/SIGNED_SUBJECTS.json
            desktop-signing-smoke/NOTARY_RECEIPT.json
            desktop-signing-smoke/notary-subjects.zip
          if-no-files-found: warn
  desktop-signing-windows:
    needs: desktop-signing-config
    if: inputs.desktop_signing_smoke && inputs.sign_and_attest && !inputs.publish && github.ref == 'refs/heads/main'
    environment: store-signing
    runs-on: ${{ vars.STORE_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ENABLE_SIGNING: ${{ inputs.sign_and_attest }}
      ENABLE_PUBLISHING: ${{ inputs.publish }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Offline controls before OIDC or signing
        run: python -m unittest discover -s tools/trust -p "test_desktop_*.py" -v
      - name: Validate public coordinator configuration without credentials
        run: python tools/trust/desktop_signing.py preflight-windows --target windows_x86_64 --output desktop-oidc-preflight
      - name: Compile only the fixed tiny public fixture, pin exact subjects
        run: python tools/trust/desktop_signing.py prepare-smoke --target windows_x86_64 --output desktop-signing-smoke
      - name: OIDC login scoped to the protected store-signing environment
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Artifact Signing Public Trust on the two exact control files
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\desktop-signing-smoke\subjects\desktop-signing-smoke.exe
            ${{ github.workspace }}\desktop-signing-smoke\subjects\desktop-signing-smoke-lib.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify Authenticode chain, expected publisher, timestamp and code/data
        run: python tools/trust/desktop_signing.py verify-windows-smoke --target windows_x86_64 --output desktop-signing-smoke
      - name: Attest only final public control bytes and safe receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            desktop-signing-smoke/subjects/desktop-signing-smoke.exe
            desktop-signing-smoke/subjects/desktop-signing-smoke-lib.dll
            desktop-signing-smoke/RESULT.json
      - name: Safe public control evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-signing-smoke-${{ env.STORE_PACKAGE }}-windows_x86_64
          path: |
            desktop-oidc-preflight/RESULT.json
            desktop-signing-smoke/RESULT.json
            desktop-signing-smoke/SUBJECTS.json
          if-no-files-found: warn
  assemble:
    if: github.ref == 'refs/heads/main' && !inputs.desktop_signing_smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Assemble only reviewed hash-pinned store inputs
        env:
          ENABLE_SIGNING: ${{ inputs.sign_and_attest }}
          ENABLE_PUBLISHING: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os,re,json
          version=os.environ['STORE_VERSION']
          if not re.fullmatch(r'[0-9][A-Za-z0-9.]+',version): raise SystemExit('invalid version')
          if os.environ['ENABLE_PUBLISHING']=='true' and os.environ['ENABLE_SIGNING']!='true': raise SystemExit('publishing requires signing')
          manifest=json.load(open('.store/manifests/'+os.environ['STORE_PACKAGE']+'/'+version+'.json'))
          if manifest['package']!=os.environ['STORE_PACKAGE'] or manifest['version']!=version: raise SystemExit('manifest identity mismatch')
          PY
      - name: Verify independent public vendor entitlement anchor
        run: python tools/trust/entitlement.py verify-anchor --public-key trust/vendor-entitlement-v1.pub.pem
      - name: Test offline trust helpers
        run: python -m unittest discover -s tools/trust -p 'test_*.py' -v
      - name: Fetch reviewed inputs using the read-only deploy key or release PAT
        env:
          GH_TOKEN: ${{ secrets.STORE_INPUTS_READ_TOKEN }}
          STORE_INPUTS_DEPLOY_KEY: ${{ secrets.STORE_INPUTS_DEPLOY_KEY }}
          INPUT_TRANSPORT: ${{ inputs.input_transport }}
        run: python tools/trust/fetch_private_inputs.py --descriptor ".store/inputs/$STORE_PACKAGE/$STORE_VERSION.json" --output store-inputs --transport "$INPUT_TRANSPORT"
      - name: Assemble the approved store inputs without a protector
        run: python tools/trust/ci_support.py assemble --manifest ".store/manifests/$STORE_PACKAGE/$STORE_VERSION.json" --output store-release
      - name: Keep final artifacts separate from reference/check inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-final-ta-lib-takt
          path: |
            store-release/dist/*.whl
            store-release/dist/*.store.json
            store-release/native/**/*
            store-release/STORE_MANIFEST.json
            store-release/release_files.json
            store-release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-check-input-ta-lib-takt
          path: store-release/
          if-no-files-found: error
      - name: Keep the PyPI upload artifact limited to final wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-pypi-ta-lib-takt
          path: store-release/dist/*.whl
          if-no-files-found: error
  checks:
    needs: assemble
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-check-input-ta-lib-takt
          path: store-release
      - name: Install declared test dependencies and tracer
        run: |
          python -m pip install --only-binary=:all: numpy==2.5.4 scipy==1.18.1 narwhals==2.28.0
          sudo apt-get update -qq
          sudo apt-get install -y strace util-linux
      - name: Check installed final wheel and complete native outputs
        run: python tools/trust/ci_support.py check --bundle store-release --output check-results
      - name: Upload summary only, never raw traces or model/input contents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-check-summary-ta-lib-takt
          path: check-results/RESULT.json
          if-no-files-found: warn
  scanners:
    needs: assemble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-final-ta-lib-takt
          path: store-release
      - name: Dated local ClamAV signal on final bytes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service
          if [ -f /etc/apparmor.d/usr.bin.freshclam ]; then
            cat /etc/apparmor.d/usr.bin.freshclam > CLAMAV_APPARMOR_PROFILE.txt
          fi
          sudo python3 tools/trust/prepare_clamav.py --root /var/lib/clamav/store-release --owner clamav --metadata CLAMAV_CONFIG.json
          sudo chown clamav:clamav /var/lib/clamav/store-release /var/lib/clamav/store-release/db
          sudo install -o root -g clamav -m 0640 /var/lib/clamav/store-release/freshclam.conf /etc/clamav/freshclam.conf
          sudo cmp /var/lib/clamav/store-release/freshclam.conf /etc/clamav/freshclam.conf
          sudo stat -c '%n mode=%a owner=%U group=%G' /etc/clamav/freshclam.conf /var/lib/clamav/store-release/db > CLAMAV_INSTALLED_PATHS.txt
          sudo freshclam --config-file=/etc/clamav/freshclam.conf --version > FRESHCLAM_CONFIG_CHECK.txt 2>&1
          sudo freshclam --stdout --config-file=/etc/clamav/freshclam.conf 2>&1 | tee FRESHCLAM.txt
          sudo freshclam --config-file=/etc/clamav/freshclam.conf --version > CLAMAV_DEFINITIONS.txt
          sudo clamscan --database=/var/lib/clamav/store-release/db --fail-if-cvd-older-than=2 --alert-exceeds-max=yes --recursive --scan-archive=yes --max-filesize=512M --max-scansize=2048M store-release/dist store-release/native 2>&1 | tee CLAMAV.txt
          python tools/trust/summarize_clamav.py --scan CLAMAV.txt --definitions CLAMAV_DEFINITIONS.txt --update FRESHCLAM.txt --output CLAMAV_SUMMARY.json
      - name: Dated VirusTotal observations - licensed GET API or owner-supplied hash links
        if: always()
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ENABLE_SIGNING: ${{ inputs.sign_and_attest }}
          VT_REPORT_URLS: ${{ inputs.vt_report_urls }}
          VT_OBSERVED_AT: ${{ inputs.vt_observed_at }}
          VT_COMMERCIAL_API_AUTHORIZED: ${{ inputs.vt_commercial_api_authorized }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--query --output VIRUSTOTAL.json --markdown-output VIRUSTOTAL_LINKS.md
            --manual-report-urls "$VT_REPORT_URLS" --observed-at "$VT_OBSERVED_AT")
          if [ "$ENABLE_SIGNING" = true ]; then options+=(--require-complete); fi
          if [ "$VT_COMMERCIAL_API_AUTHORIZED" = true ]; then options+=(--commercial-api-authorized); fi
          status=0
          python tools/trust/virustotal_hashes.py store-release/dist/*.store.json "${options[@]}" || status=$?
          if [ -f VIRUSTOTAL_LINKS.md ]; then cat VIRUSTOTAL_LINKS.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-scanner-summary-ta-lib-takt
          path: |
            CLAMAV.txt
            CLAMAV_SUMMARY.json
            FRESHCLAM.txt
            CLAMAV_CONFIG.json
            CLAMAV_INSTALLED_PATHS.txt
            CLAMAV_APPARMOR_PROFILE.txt
            FRESHCLAM_CONFIG_CHECK.txt
            CLAMAV_DEFINITIONS.txt
            VIRUSTOTAL.json
            VIRUSTOTAL_LINKS.md
          if-no-files-found: warn
  sign:
    needs: [assemble, checks, scanners]
    if: inputs.sign_and_attest && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment: store-signing
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-final-ta-lib-takt
          path: store-release
      - name: Install independently pinned signing tool
        run: python tools/trust/install_cosign.py --output signing-tools/cosign
      # Keyless artifact signatures use GitHub OIDC; vendor key is for offline entitlements only.
      - name: Sign final wheel, exact native payloads and manifest; execute none
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: python tools/trust/sign_release.py --bundle store-release --output signatures --cosign signing-tools/cosign --mode keyless --identity "$EXPECTED_IDENTITY"
      - name: Attest assembly provenance of final artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            store-release/dist/*.whl
            store-release/native/**/*
            store-release/STORE_MANIFEST.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: store-signatures-ta-lib-takt
          path: signatures/
          if-no-files-found: error
  publish:
    needs: [assemble, checks, scanners, sign]
    if: inputs.publish && inputs.sign_and_attest && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/ta-lib-takt
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: store-pypi-ta-lib-takt
          path: dist
      - name: PyPI Trusted Publishing with PEP 740 publish attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
